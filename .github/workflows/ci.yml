name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: |
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          if ! grep -q '"com.example.car_logger.debug"' app/google-services.json; then
            jq '.client += [(.client[0] | .client_info.android_client_info.package_name = "com.example.car_logger.debug")]' app/google-services.json > app/google-services.json.tmp && mv app/google-services.json.tmp app/google-services.json
          fi

      - name: Run Unit Tests and Lint
        run: ./gradlew testDebugUnitTest lintDebug
